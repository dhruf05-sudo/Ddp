<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/frontend/css/editor.css">
  <title>Create post</title>
</head>

<body>
  <header>
    <a href="/frontend/pages/home.html">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/></svg>
    </a>
    <h2>Create post</h2><span></span>
  </header>
  <div class="mainCreator">
    <a class="modeLink" href="/frontend/pages/poll.html">▥ Create poll</a>
    <form id="createPostForm" class="postCard">
      <textarea class="topic" name="topic" placeholder="Topic"></textarea>
      <textarea name="content" placeholder="What's happening?"></textarea>
      <label class="fileBox">Add image (optional)<input id="postImage" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></label>
      <div id="imagePreview"></div>
      <div class="gridBtn"><button class="shareBtn">Share!</button></div>
    </form>
  </div>
  <script src="/frontend/js/app.js"></script>
</body>

</html>
